name: Weekly Coverage Update
on:
  schedule:
    - cron: "30 11 * * 4"
  workflow_dispatch:

jobs:
  update-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest coverage
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Extract coverage percentage
      id: get_coverage
      shell: bash
      run: |
        # 1. Run coverage & tests
        coverage run -m pytest tests/
        # 2. Grab the TOTAL line
        TOTAL_LINE=$(coverage report | grep TOTAL || true)
        echo "::debug::TOTAL_LINE=<$TOTAL_LINE>"
        # 3. Parse out the percentage (default to 0 if nothing found)
        if [[ -n "$TOTAL_LINE" ]]; then
          COVERAGE_PERCENTAGE=$(echo "$TOTAL_LINE" | awk '{print $NF}' | sed 's/%//')
        else
          echo "::warning::No TOTAL line found, defaulting to 0"
          COVERAGE_PERCENTAGE=0
        fi
        # 4. Echo for logs and set as an output
        echo "Extracted coverage: $COVERAGE_PERCENTAGE%"
        echo "coverage=$COVERAGE_PERCENTAGE" >> $GITHUB_OUTPUT
    - name: Determine badge color
      id: get_color
      run: |
        COVERAGE=${{ steps.get_coverage.outputs.coverage }}
        if (( $(echo "$COVERAGE >= 90" | bc -l) )); then
          COLOR="brightgreen"
        elif (( $(echo "$COVERAGE >= 80" | bc -l) )); then
          COLOR="green"
        elif (( $(echo "$COVERAGE >= 70" | bc -l) )); then
          COLOR="yellowgreen"
        elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
          COLOR="yellow"
        else
          COLOR="red"
        fi
        echo "color=$COLOR" >> $GITHUB_OUTPUT
    - name: Update coverage badge and history
      run: |
        FILE=".github/badges/coverage-badge.json"
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        if [ -f "$FILE" ]; then
          jq --arg coverage "$COVERAGE" \
             --arg color "$COLOR" \
             --arg time "$TIMESTAMP" '
            .message = "${{ steps.get_coverage.outputs.coverage }}%" |
            .color = "${{ steps.get_color.outputs.color }}" |
            .history += [{
              timestamp: $time,
              coverage: (${{ steps.get_coverage.outputs.coverage }}, | tonumber)
            }]
          ' "$FILE" > tmp.json && mv tmp.json "$FILE"
        else
          mkdir -p .github/badges
          echo '{
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${{ steps.get_coverage.outputs.coverage }}%",,
            "color": "${{ steps.get_color.outputs.color }}",
            "history": [
              {
                "timestamp": "'"$TIMESTAMP"'",
                "coverage": "${{ steps.get_coverage.outputs.coverage }}%",
              }
            ]
          }' > "$FILE"
        fi
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GIST_SECRET }}
        commit-message: Update code coverage badge
        title: Weekly Code Coverage Update
        body: |
          This PR updates the code coverage badge.
          Current coverage: ${{ steps.get_coverage.outputs.coverage }}%
          Auto-generated by GitHub Actions.
        branch: update-coverage-badge
        base: development
        delete-branch: true
        push-to-fork: LASY-org/LASY
