name: Weekly Coverage Update
on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch:

jobs:
  update-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest coverage
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run tests with coverage
      run: |
        coverage run -m pytest tests/
    - name: Extract coverage percentage
      id: get_coverage
      run: |
        # Save report and extract percentage
        coverage report > coverage_report.txt
        TOTAL_LINE=$(grep TOTAL coverage_report.txt || echo "No TOTAL line found")
        
        if [[ "$TOTAL_LINE" == *"TOTAL"* ]]; then
          COVERAGE_PERCENTAGE=$(echo "$TOTAL_LINE" | awk '{print $NF}' | sed 's/%//')
        else
          LAST_LINE=$(tail -1 coverage_report.txt)
          COVERAGE_PERCENTAGE=$(echo "$LAST_LINE" | awk '{print $NF}' | sed 's/%//')
        fi
        echo "Extracted coverage: $COVERAGE_PERCENTAGE%"
        echo "coverage=$COVERAGE_PERCENTAGE" >> $GITHUB_OUTPUT
    - name: Determine badge color
      id: get_color
      run: |
        COVERAGE=${{ steps.get_coverage.outputs.coverage }}
        if (( $(echo "$COVERAGE >= 90" | bc -l) )); then
          COLOR="brightgreen"
        elif (( $(echo "$COVERAGE >= 80" | bc -l) )); then
          COLOR="green"
        elif (( $(echo "$COVERAGE >= 70" | bc -l) )); then
          COLOR="yellowgreen"
        elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
          COLOR="yellow"
        else
          COLOR="red"
        fi
        echo "color=$COLOR" >> $GITHUB_OUTPUT
    - name: Create or update coverage.json
      run: |
        mkdir -p .github/badges
        cat > .github/badges/coverage-badge.json << EOF
        {
          "schemaVersion": 1,
          "label": "coverage",
          "message": "${{ steps.get_coverage.outputs.coverage }}%",
          "color": "${{ steps.get_color.outputs.color }}"
        }
        EOF
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GIST_SECRET }}
        commit-message: Update code coverage badge
        title: Weekly Code Coverage Update
        body: |
          This PR updates the code coverage badge.
          
          Current coverage: ${{ steps.get_coverage.outputs.coverage }}%
          
          Auto-generated by GitHub Actions.
        branch: update-coverage-badge
        base: development
        delete-branch: true
